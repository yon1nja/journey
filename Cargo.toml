[package]
name = "journey"
version = "0.3.0"
edition = "2021"
description = "Context persistence for engineering efforts"
license = "MIT"
readme = "README.md"
repository = "https://github.com/yon1nja/journey"
homepage = "https://github.com/yon1nja/journey"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
dirs = "5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tempfile = "3.10"
time = { version = "0.3", features = ["formatting", "parsing"] }

[dev-dependencies]
tempfile = "3.10"
