[workspace]

[package]
name = "journey"
version = "0.2.0"
edition = "2021"
description = "Context persistence for engineering efforts"
license = "MIT"
readme = "README.md"
repository = "https://github.com/yon1nja/journey"
homepage = "https://github.com/yon1nja/journey"

[dependencies]
alacritty_terminal = "0.26"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
dirs = "5.0"
portable-pty = "0.9"
pulldown-cmark = "0.12"
ratatui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
syntect = { version = "5.2", default-features = false, features = ["default-fancy"] }
tempfile = "3.10"
thiserror = "1.0"
time = { version = "0.3", features = ["formatting", "parsing"] }
toml = "0.8"

[dev-dependencies]
tempfile = "3.10"
